name: cli test

on:
  push:
  workflow_dispatch:

jobs:
  databricks-deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/devops-hemant/declis:v0.0.3
    steps:
      - name: Verify tools
        run: |
          az version
          databricks -v
          dbsqlcli --help || echo "dbsqlcli is installed"
          yq --version
          jq --version
          curl --version
